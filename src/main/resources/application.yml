server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/newsdb?useSSL=false&serverTimezone=UTC&characterEncoding=utf-8
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
#  mapper 配置
  mapper-locations: classpath*:/mapper/*.xml
  type-aliases-package: com.aka.news.pojo.entity
  configuration:
#    数据库下划线，转为驼峰命名
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  pagination:
    type: OFFSET
  globalConfig:
    db-config:
#      主键策略，雪花算法
      id-type: auto
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

